<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de paciente — OdontoIA</title>
  <style>
    :root { --wa: #075e54; --wa2: #128c7e; --me: #d9fdd3; --bg: #efeae2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; color: #111b21; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #0b3b38, #115e59); display: flex; gap: 32px; align-items: center; justify-content: center; padding: 24px 16px; flex-wrap: wrap; }
    .painel { color: #e6f4f1; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .painel h1 { margin: 0; font-size: 22px; color: #fff; }
    .painel p { margin: 0; line-height: 1.5; color: #b8dcd6; }
    .painel label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #b8dcd6; }
    .painel input, .painel select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; }
    .painel select option { color: #111; }
    .painel .btn { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; cursor: pointer; text-align: left; }
    .painel .btn:hover { background: rgba(255,255,255,.18); }
    .painel a { color: #5eead4; }
    .sugestoes { display: flex; flex-direction: column; gap: 6px; }
    .phone { width: 390px; max-width: 100%; height: min(780px, calc(100vh - 48px)); background: #000; border-radius: 42px; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    .screen { height: 100%; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
    .top { background: var(--wa); color: #fff; padding: 34px 14px 10px; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #14b8a6; display: grid; place-items: center; flex: none; }
    .top b { display: block; font-size: 15px; }
    .top small { color: #cfe9e5; }
    .msgs { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; background-color: var(--bg); background-image: radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px); background-size: 18px 18px; }
    .b { max-width: 82%; padding: 6px 9px 4px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.35; box-shadow: 0 1px .5px rgba(0,0,0,.13); font-size: 14.2px; }
    .b .h { font-size: 10.5px; color: #667781; text-align: right; margin-top: 2px; }
    .eu { align-self: flex-end; background: var(--me); border-top-right-radius: 2px; }
    .ela { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }
    .rodape { font-size: 12px; color: #667781; margin-top: 4px; }
    .tpl { align-self: flex-start; display: grid; gap: 2px; width: min(82%, 280px); margin-top: -2px; }
    .tpl a, .tpl button { display: block; background: #fff; border: 0; border-radius: 8px; padding: 9px; text-align: center; color: #027eb5; font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
    .tpl button:hover, .tpl a:hover { background: #f5f6f6; }
    .aviso { align-self: center; background: #fff8c4; font-size: 12px; color: #54656f; padding: 5px 10px; border-radius: 8px; margin: 6px 0; text-align: center; max-width: 90%; }
    .bar { display: flex; gap: 6px; padding: 8px; background: #f0f2f5; align-items: flex-end; }
    .bar textarea { flex: 1; resize: none; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; max-height: 110px; outline: none; }
    .bar button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--wa2); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
    .bar button:disabled { opacity: .5; }
    @media (max-width: 800px) { .painel { order: 2; } .phone { height: 680px; } }
  </style>
</head>
<body>
  <div class="painel">
    <h1>Simulador de paciente</h1>
    <p>Converse com a recepcionista de IA como se fosse o WhatsApp do paciente. Deixe o <a href="./#/conversas" target="_blank">painel de conversas</a> e a <a href="./#/agenda" target="_blank">agenda</a> abertos ao lado para ver tudo acontecendo em tempo real.</p>
    <label>Entrar como
      <select id="perfil"><option value="">Contato novo (número aleatório)</option></select>
    </label>
    <label>Telefone do paciente <input id="tel"></label>
    <div class="sugestoes">
      <span style="font-size:12px;font-weight:600;color:#b8dcd6">Experimente</span>
      <button class="btn" data-s="Oi! Quero marcar uma limpeza, tem horário essa semana?">🦷 Marcar uma limpeza</button>
      <button class="btn" data-s="Quanto custa um clareamento? Vocês aceitam cartão?">💳 Preço do clareamento</button>
      <button class="btn" data-s="Estou com muita dor de dente desde ontem, o que eu faço?">😣 Dor de dente</button>
      <button class="btn" data-s="Preciso remarcar minha consulta">📅 Remarcar consulta</button>
      <button class="btn" data-s="Quero falar com uma pessoa, por favor">🙋 Falar com atendente</button>
    </div>
  </div>

  <div class="phone"><div class="screen">
    <div class="top">
      <div class="avatar"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M10 8c-3 0-4 3-3 7 1 3 1 9 3 9s2-5 3-5h6c1 0 1 5 3 5s2-6 3-9c1-4 0-7-3-7-2 0-3 1-6 1s-4-1-6-1z" fill="white"/></svg></div>
      <div><b id="clinica">Clínica</b><small id="estado">online</small></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="bar">
      <textarea id="txt" rows="1" placeholder="Mensagem"></textarea>
      <button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
    </div>
  </div></div>

  <script type="module">
    await import('./demo-boot.js');
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const aleatorio = () => `5551998${String(Math.floor(Math.random() * 1e6)).padStart(6, '0')}`;
    let telefone = localStorage.getItem('sim-tel') || aleatorio();
    let es;

    const settings = await fetch('/api/settings').then((r) => r.json());
    const status = await fetch('/api/status').then((r) => r.json());
    const avisoDemo = status.demo ? '<div class="aviso">🧪 Modo demonstração: respostas simuladas, sem IA de verdade</div>' : '';
    $('#clinica').textContent = settings.nome_clinica || 'Clínica';
    const pacientes = await fetch('/api/patients').then((r) => r.json());
    $('#perfil').insertAdjacentHTML('beforeend', pacientes.filter((p) => p.telefone).slice(0, 12)
      .map((p) => `<option value="${p.telefone}">${esc(p.nome)}${p.proxima_consulta ? ' (tem consulta marcada)' : ''}</option>`).join(''));

    function bolha(m) {
      if (m.autor === 'sistema') return '';
      const eu = m.autor === 'paciente';
      const texto = esc(m.texto).replace(/https?:\/\/[^\s<]+/g, (url) => `<a href="${url}" target="_blank" rel="noopener" style="color:#027eb5;word-break:break-all">${url}</a>`);
      const x = m.extras;
      const rodape = x?.rodape ? `<div class="rodape">${esc(x.rodape)}</div>` : '';
      // Mensagens por modelo do WhatsApp trazem botões: resposta rápida (envia o texto) ou link.
      const botoes = x?.botoes?.length
        ? `<div class="tpl" data-botoes="${m.id}">${x.botoes.map((b) => (b.tipo === 'link' && b.url
          ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">↗ ${esc(b.texto)}</a>`
          : `<button type="button" data-resposta="${esc(b.texto)}">↩ ${esc(b.texto)}</button>`)).join('')}</div>`
        : '';
      return `<div class="b ${eu ? 'eu' : 'ela'}" data-id="${m.id}">${texto}${rodape}<div class="h">${hora(m.criado_em)}${eu ? ' ✓✓' : ''}</div></div>${botoes}`;
    }
    const rolar = () => { $('#msgs').scrollTop = $('#msgs').scrollHeight; };

    async function carregar() {
      $('#tel').value = telefone;
      $('#perfil').value = [...$('#perfil').options].some((o) => o.value === telefone) ? telefone : '';
      localStorage.setItem('sim-tel', telefone);
      const { mensagens } = await fetch(`/api/simulador/conversa?telefone=${telefone}`).then((r) => r.json());
      $('#msgs').innerHTML = `<div class="aviso">🔒 Simulação de WhatsApp · ${telefone}</div>${avisoDemo}` + mensagens.map(bolha).join('');
      rolar();
      es?.close();
      es = new EventSource(`/api/stream?telefone=${telefone}`);
      es.addEventListener('mensagem', (e) => {
        const { message, draft_id } = JSON.parse(e.data);
        if (draft_id) document.querySelector(`[data-draft="${draft_id}"]`)?.remove();
        if (!document.querySelector(`[data-id="${message.id}"]`)) $('#msgs').insertAdjacentHTML('beforeend', bolha(message));
        rolar();
      });
      es.addEventListener('ia_delta', (e) => {
        const { draft_id, delta } = JSON.parse(e.data);
        let d = document.querySelector(`[data-draft="${draft_id}"]`);
        if (!d) {
          $('#msgs').insertAdjacentHTML('beforeend', `<div class="b ela" data-draft="${draft_id}"><span class="t"></span></div>`);
          d = document.querySelector(`[data-draft="${draft_id}"]`);
        }
        d.querySelector('.t').textContent += delta;
        rolar();
      });
      es.addEventListener('ia_rascunho_descartado', (e) => document.querySelector(`[data-draft="${JSON.parse(e.data).draft_id}"]`)?.remove());
      es.addEventListener('ia_digitando', (e) => { $('#estado').textContent = JSON.parse(e.data).ativo ? 'digitando…' : 'online'; });
    }

    async function enviar(texto) {
      texto = (texto ?? $('#txt').value).trim();
      if (!texto) return;
      $('#txt').value = '';
      const r = await fetch('/api/simulador/mensagem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telefone, texto }) });
      if (!r.ok) alert((await r.json()).erro);
    }

    $('#send').onclick = () => enviar();
    $('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
    document.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => enviar(b.dataset.s)));
    $('#msgs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-resposta]');
      if (b) enviar(b.dataset.resposta);
    });
    $('#perfil').onchange = (e) => { telefone = e.target.value || aleatorio(); carregar(); };
    $('#tel').onchange = (e) => { const d = e.target.value.replace(/\D/g, ''); if (d.length >= 10) { telefone = d.length <= 11 ? `55${d}` : d; carregar(); } };
    carregar();
  </script>
</body>
</html>
