<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OdontoIA — Painel da clínica</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314b8a6'/><path d='M10 8c-3 0-4 3-3 7 1 3 1 9 3 9s2-5 3-5h6c1 0 1 5 3 5s2-6 3-9c1-4 0-7-3-7-2 0-3 1-6 1s-4-1-6-1z' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" width="22" height="22"><path d="M10 8c-3 0-4 3-3 7 1 3 1 9 3 9s2-5 3-5h6c1 0 1 5 3 5s2-6 3-9c1-4 0-7-3-7-2 0-3 1-6 1s-4-1-6-1z" fill="white"/></svg>
        </div>
        <span id="brand-name">OdontoIA</span>
      </div>
      <nav class="nav">
        <a href="#/painel" data-nav="painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Painel
        </a>
        <a href="#/agenda" data-nav="agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Agenda
        </a>
        <a href="#/conversas" data-nav="conversas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>
          Conversas <span class="badge count hidden" id="nav-alertas"></span>
        </a>
        <a href="#/equipe-ia" data-nav="equipe-ia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/><path d="M5 15l.6 1.4L7 17l-1.4.6L5 19l-.6-1.4L3 17l1.4-.6z"/></svg>
          Equipe de IA
        </a>
        <a href="#/pacientes" data-nav="pacientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>
          Pacientes
        </a>
        <a href="#/financeiro" data-nav="financeiro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5h.01M18 15.5h.01"/></svg>
          Financeiro
        </a>
        <a href="#/config" data-nav="config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Configurações
        </a>
      </nav>
      <div class="sidebar-footer">
        <div><span class="dot" id="st-ia"></span>IA <span id="st-ia-txt">…</span></div>
        <div><span class="dot" id="st-wa"></span>WhatsApp <span id="st-wa-txt">…</span></div>
        <div style="margin-top:8px"><a href="chat.html" target="_blank">Abrir simulador de paciente ↗</a></div>
      </div>
    </aside>
    <main id="view"></main>
  </div>
  <button class="ia-fab" id="ia-fab" type="button">✨ <span>Pergunte à IA</span></button>
  <aside class="ia-drawer" id="ia-drawer" aria-label="Assistente de IA da clínica">
    <div class="ia-head">
      <div class="ia-avatar">✨</div>
      <div style="min-width:0"><b>Assistente da clínica</b><div class="muted small">Agenda, pacientes, financeiro e dúvidas clínicas</div></div>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="ia-nova" type="button" title="Começar uma conversa nova">Nova conversa</button>
      <button class="btn ghost sm" id="ia-fechar" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="ia-body" id="ia-body"></div>
    <div class="ia-sugestoes" id="ia-sugestoes"></div>
    <form class="ia-form" id="ia-form">
      <textarea id="ia-input" rows="1" placeholder="Pergunte sobre agenda, pacientes, financeiro ou uma dúvida clínica…"></textarea>
      <button class="btn primary" id="ia-enviar">Enviar</button>
    </form>
  </aside>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts"></div>
  <script type="module">await import('./demo-boot.js'); await import('./app.js');</script>
</body>
</html>
